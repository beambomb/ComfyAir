name: Deploy ComfyAir to Azure Web App

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Public HTTPS URL of ComfyAir FastAPI Backend"
        required: false
        default: "https://comfyair-api.azurewebsites.net"

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure (requires AZURE_CREDENTIALS secret)
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build backend container image
        run: docker build -t comfyair-backend:latest ./backend
      - name: Deploy backend to Azure Web App
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: comfyair-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: ./backend

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend
    steps:
      - uses: actions/checkout@v4
      - name: Build static frontend container
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ github.event.inputs.backend_url || 'https://comfyair-api.azurewebsites.net' }} \
            -t comfyair-frontend:latest ./frontend
      - name: Deploy frontend to Azure Web App
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: comfyair-web
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: ./frontend
