services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comfyair-backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      PORT: "8000"
      HOST: "0.0.0.0"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      JWT_SECRET: "${JWT_SECRET:-comfyair-docker-dev-secret}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_KEY: "${SUPABASE_KEY:-}"
    networks:
      - comfyair-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    container_name: comfyair-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - comfyair-net

networks:
  comfyair-net:
    driver: bridge
